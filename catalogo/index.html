<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b40"><title>VITTA Perfumería | Ushuaia</title><style>
:root{--navy:#101b40;--deep:#07132b;--gold:#d9b66e;--cream:#f7e7c5}*{box-sizing:border-box}body{margin:0;background:var(--deep);color:#f6f0e5;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(180deg,#101b40 0%,#142448 65%,#09152d 100%);text-align:center;padding:35px 16px 28px;border-bottom:1px solid #b99b62}.logo{font:normal clamp(65px,13vw,116px)/.9 Georgia,serif;letter-spacing:-5px;color:var(--gold)}.subtitle{font:normal 25px Georgia,serif;color:var(--gold);margin:12px 0}.ornament{color:#c3b69c;letter-spacing:6px}.hero{background:radial-gradient(ellipse at 50% 100%,#b57753 0%,#293c62 25%,transparent 65%);padding:24px 12px 18px}.hero h1{font:italic clamp(22px,4vw,32px) Georgia,serif;color:var(--cream);margin:4px}.hero p{color:#e5dccc;margin:8px}main{max-width:1100px;margin:auto;padding:24px 16px 90px}.toolbar{display:flex;gap:10px;margin-bottom:22px}.toolbar input,.toolbar select{background:#12254a;color:white;border:1px solid #8c91a6;border-radius:10px;padding:13px;min-width:0}.toolbar input{flex:1}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.product{background:linear-gradient(155deg,#1b3053,#0b1831);border:1px solid #8c754b;border-radius:15px;overflow:hidden;display:flex;flex-direction:column}.photo{height:260px;background:linear-gradient(165deg,#14264c,#7d5b62 45%,#0c1b3c 70%);display:grid;place-items:center;overflow:hidden;position:relative}.photo:before{content:"";position:absolute;bottom:15%;width:150%;height:30%;background:linear-gradient(165deg,transparent 30%,#d6b0a1 31%,#29365b 34%,transparent 38%,#8390a5 45%,#101d39 48%,transparent 54%);opacity:.55}.photo img{position:relative;width:100%;height:100%;object-fit:contain;z-index:1}.photo .placeholder{position:relative;z-index:1;font:italic 28px Georgia;color:#e9c68b;padding:25px;text-align:center}.info{padding:15px;display:flex;flex-direction:column;gap:8px;flex:1}.info h2{font:normal 23px Georgia,serif;margin:0;color:#f5dfb5}.brand{color:#d0d7e4;font-size:14px}.price{font-size:23px;font-weight:700}.availability{font-size:13px;color:#dfcda6}.button{display:block;text-align:center;border:0;cursor:pointer;background:linear-gradient(#f0d391,#bf8d3c);color:#0c1b35;padding:13px 16px;border-radius:10px;font-weight:700;text-decoration:none}.info .button{margin-top:auto}.back{color:var(--gold);border:0;background:transparent;font-size:16px;cursor:pointer;margin-bottom:18px}.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:25px}.detail .photo{height:440px;border-radius:14px;border:1px solid #aa8856}.detail h1{font:normal clamp(32px,5vw,46px) Georgia,serif;color:var(--gold);margin:8px 0}.detail p{line-height:1.65}.detail .price{font-size:32px}.notes{margin:28px 0}.notes h2{text-align:center;color:var(--gold);font:normal 28px Georgia}.note-row{border:1px solid #bd955b;border-radius:12px;padding:12px;margin:10px 0;background:#132546}.note-row h3{color:var(--gold);font:normal 22px Georgia;margin:0 0 12px}.ingredients{display:flex;flex-wrap:wrap;gap:12px}.ingredient{min-width:80px;flex:1;text-align:center;font-size:13px}.ingredient .emoji{font-size:30px;display:block;margin-bottom:6px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions .button:first-child{grid-column:span 2}.outline{background:transparent;color:var(--cream);border:1px solid var(--gold)}.foot{text-align:center;color:#c9b583;padding:35px 16px;border-top:1px solid #7d6a4d}#payment{display:none;background:#12264a;border:1px solid #b79a61;padding:18px;border-radius:12px;margin-top:16px}#payment.visible{display:block}#payment button{padding:9px;margin-top:10px;border-radius:7px} @media(max-width:650px){.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:205px}.info{padding:10px}.info h2{font-size:18px}.price{font-size:19px}.detail{grid-template-columns:1fr}.detail .photo{height:330px}.toolbar{flex-wrap:wrap}.toolbar select{width:100%}.actions{grid-template-columns:1fr}.actions .button:first-child{grid-column:auto}}
</style></head><body><header><div class="logo">vitta</div><div class="ornament">── ❧ ◈ ❧ ──</div><div class="subtitle">Perfumería</div><div class="hero"><h1>Descubrí tu próxima fragancia</h1><p>VITTA · Ushuaia</p></div></header><main id="app"></main><footer class="foot">VITTA Perfumería · Ushuaia</footer><script>
const products=[{"id":"asad-bourbon","name":"Asad Bourbon","brand":"Lattafa","price":89000,"image":"Asad Bourbon Arabian Perfume Poster.png","description":"Una fragancia intensa, especiada y elegante.","stock":null,"notes":null},{"id":"fakhar-rose","name":"Fakhar Rose","brand":"Lattafa","price":89000,"image":"Fakhar Rose Luxury Perfume Poster.png","description":"Una propuesta floral, luminosa y sofisticada.","stock":null,"notes":null},{"id":"khamrah-qahwa","name":"Khamrah Qahwa","brand":"Lattafa","price":79000,"image":"Khamrah Qahwa Luxury Perfume Ad.png","description":"Café, especias y dulzura envolvente.","stock":null,"notes":{"salida":["Jengibre","Canela","Cardamomo"],"corazon":["Praliné","Frutas confitadas","Flores blancas"],"fondo":["Café","Vainilla","Haba tonka","Benjuí","Almizcle"]}},{"id":"bharara-king","name":"Bharara King","brand":"Bharara","price":129000,"image":"Bharara King Golden Crown Perfume Poster.png","description":"Una fragancia de carácter cálido y distinguido.","stock":null,"notes":null},{"id":"club-de-nuit-intense-man","name":"Club de Nuit Intense Man","brand":"Armaf","price":109000,"image":"Perfume Armaf Club de Nuit Intense Man.png","description":"Una fragancia masculina de gran personalidad.","stock":null,"notes":null},{"id":"club-de-nuit-urban-man","name":"Club de Nuit Urban Man","brand":"Armaf","price":99000,"image":"","description":"Aromas frescos y modernos.","stock":null,"notes":null},{"id":"club-de-nuit-iconic","name":"Club de Nuit Iconic","brand":"Armaf","price":119000,"image":"VITTA Ushuaia Iconic Perfume Ad.png","description":"Una interpretación elegante y versátil.","stock":null,"notes":null},{"id":"club-de-nuit-imperiale","name":"Club de Nuit Imperiale","brand":"Armaf","price":119000,"image":"Elegancia Imperial en VITTA Ushuaia.png","description":"Un perfume de perfil refinado.","stock":null,"notes":null},{"id":"9am-dive","name":"9AM Dive","brand":"Afnan","price":97000,"image":"Afnan 9AM Dive Perfume Poster.png","description":"Frescura para acompañarte durante el día.","stock":null,"notes":null},{"id":"shaheen-gold","name":"Shaheen Gold","brand":"Lattafa","price":89000,"image":"Shaheen Gold Perfume in Desert Sunset.png","description":"Un perfume cálido y luminoso.","stock":null,"notes":null}];const app=document.getElementById("app");const money=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n);const wa=(name)=>"https://wa.me/542901467487?text="+encodeURIComponent("Hola, quiero consultar por "+name);const instagram="https://www.instagram.com/vitta.ushuaia/";const img=p=>p.image?'<img loading="lazy" src="../'+encodeURIComponent(p.image)+'" alt="'+p.name+'" onerror="this.style.display=\'none\';this.parentNode.insertAdjacentHTML(\'beforeend\',\'<span class=placeholder>Imagen próximamente</span>\')">':'<span class="placeholder">Imagen próximamente</span>';const photo=p=>'<div class="photo">'+img(p)+'</div>';const stock=p=>p.stock===null?"Consultar disponibilidad":p.stock>0?"Disponible ("+p.stock+")":"Sin stock";const esc=s=>s.replaceAll("&","&amp;").replaceAll("<","&lt;");function catalog(){app.innerHTML='<div class="toolbar"><input id="search" placeholder="Buscar perfume..."><select id="brand"><option value="">Todas las marcas</option>'+[...new Set(products.map(p=>p.brand))].map(b=>'<option>'+b+'</option>').join("")+'</select></div><div class="products" id="grid"></div>';const draw=()=>{const q=document.getElementById("search").value.toLowerCase(),b=document.getElementById("brand").value;document.getElementById("grid").innerHTML=products.filter(p=>(p.name+" "+p.brand).toLowerCase().includes(q)&&(!b||p.brand===b)).map(p=>'<article class="product">'+photo(p)+'<div class="info"><h2>'+esc(p.name)+'</h2><div class="brand">'+p.brand+'</div><div class="price">'+money(p.price)+'</div><div class="availability">'+stock(p)+'</div><a class="button" href="#'+p.id+'">Ver perfume →</a></div></article>').join("")||'<p>No encontramos perfumes con ese filtro.</p>'};document.getElementById("search").addEventListener("input",draw);document.getElementById("brand").addEventListener("change",draw);draw()}const emojis={"Jengibre":"🫚","Canela":"🪵","Cardamomo":"🌿","Praliné":"🍫","Frutas confitadas":"🍬","Flores blancas":"🌼","Café":"☕","Vainilla":"🌼","Haba tonka":"🫘","Benjuí":"🍯","Almizcle":"✨"};function detail(p){const notes=p.notes?'<section class="notes"><h2>✦ Pirámide olfativa ✦</h2>'+Object.entries(p.notes).map(([k,items])=>'<div class="note-row"><h3>Notas de '+(k==="corazon"?"corazón":k)+'</h3><div class="ingredients">'+items.map(n=>'<div class="ingredient"><span class="emoji">'+(emojis[n]||"🌸")+'</span>'+n+'</div>').join("")+'</div></div>').join("")+'</section>':'<section class="notes"><h2>Pirámide olfativa</h2><p>Estamos preparando las notas verificadas y sus ilustraciones para esta fragancia.</p></section>';app.innerHTML='<button class="back" id="back">← Volver al catálogo</button><div class="detail">'+photo(p)+'<div><h1>'+esc(p.name)+'</h1><div class="brand">'+p.brand+'</div><p>'+esc(p.description)+'</p><div class="price">'+money(p.price)+'</div><p class="availability">'+stock(p)+'</p>'+notes+'<div class="actions"><button class="button" id="buy">Comprar ahora</button><a class="button outline" target="_blank" rel="noopener" href="'+wa(p.name)+'">WhatsApp</a><a class="button outline" target="_blank" rel="noopener" href="'+instagram+'">Instagram</a></div><div id="payment"><strong>Compra por transferencia</strong><p>Consultá el alias de VITTA por WhatsApp y enviá el comprobante para confirmar tu pedido.</p><a class="button" target="_blank" rel="noopener" href="'+wa(p.name+' y recibir los datos de transferencia')+'">Solicitar datos de pago</a></div></div></div>';document.getElementById("back").onclick=()=>location.hash="";document.getElementById("buy").onclick=()=>document.getElementById("payment").classList.toggle("visible")}function route(){const p=products.find(p=>p.id===decodeURIComponent(location.hash.slice(1)));p?detail(p):catalog();window.scrollTo(0,0)}window.addEventListener("hashchange",route);route();
</script></body></html>
