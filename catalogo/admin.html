<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VITTA | Administración</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#09162f;color:#f7e9d2;font:16px system-ui,sans-serif}main{max-width:880px;margin:auto;padding:25px 18px 90px}h1{font:normal 44px Georgia,serif;color:#dcbc7d}a{color:#e9c88d}p{line-height:1.5}.panel{background:#142848;border:1px solid #9e8054;padding:20px;border-radius:13px;margin:18px 0}input{width:100%;background:#0c1c38;border:1px solid #a68a59;border-radius:9px;color:white;padding:12px;font-size:16px}label{display:block;margin:8px 0;color:#e4c990;font-size:13px}button{background:#d9b66e;color:#0b1733;border:0;border-radius:9px;padding:12px 17px;font-weight:700;cursor:pointer;margin:9px 7px 6px 0}button:disabled{opacity:.5;cursor:wait}.secondary{background:transparent;border:1px solid #d9b66e;color:#f4dbad}.row{display:grid;grid-template-columns:1fr 150px 125px;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid #48516a}.row:last-child{border:0}.name{font-weight:650}.small{font-size:13px;color:#bfcadd}#status{min-height:22px}#login,#dashboard{display:none}@media(max-width:580px){.row{grid-template-columns:1fr 1fr}.name{grid-column:span 2}}</style></head><body><main><a href="./">← Volver al catálogo</a><h1>vitta · Administración</h1><p>Administrá los precios y el stock de tu perfumería. Los cambios se publican para todos los visitantes.</p><section id="login" class="panel"><h2>Ingresar</h2><form id="loginForm"><label for="email">Correo de administración</label><input id="email" type="email" autocomplete="username" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Iniciar sesión</button></form></section><section id="dashboard" class="panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><h2>Productos</h2><button id="logout" class="secondary">Cerrar sesión</button></div><p class="small">El stock 0 significa sin unidades disponibles. Modificá los valores y presioná Guardar cambios.</p><div id="list"></div><button id="save">Guardar cambios</button><button id="reload" class="secondary">Recargar datos</button></section><p id="status" role="status" aria-live="polite"></p></main><script>
const BASE="https://tulzeyfibronnpfepzsd.supabase.co",KEY="sb_publishable_WcNN1SP2a1R7MT0UMgzXTQ_zUb9dTd8";let token=null,items=[];const $=id=>document.getElementById(id);const status=t=>$("status").textContent=t;const headers=auth=>({"apikey":KEY,...(auth?{"Authorization":"Bearer "+token}:{}),"Content-Type":"application/json"});function show(logged){$("login").style.display=logged?"none":"block";$("dashboard").style.display=logged?"block":"none"}async function request(path,opts={}){const r=await fetch(BASE+path,opts);const data=await r.json().catch(()=>null);if(!r.ok)throw Error(data?.msg||data?.message||data?.error_description||data?.error||"Error HTTP "+r.status);return data}async function signIn(email,password){const data=await request("/auth/v1/token?grant_type=password",{method:"POST",headers:headers(false),body:JSON.stringify({email,password})});token=data.access_token;return data}async function load(){const data=await request("/rest/v1/perfumes?select=id,nombre,marca,precio,stock&order=nombre.asc",{headers:headers(true)});items=data;render();show(true);status("Productos cargados desde Supabase.")}function render(){const list=$("list");list.replaceChildren();for(const p of items){const row=document.createElement("div");row.className="row";const name=document.createElement("div");name.className="name";name.textContent=p.nombre;const priceWrap=document.createElement("div");const priceLabel=document.createElement("label");priceLabel.textContent="Precio (ARS)";const price=document.createElement("input");price.type="number";price.min="0";price.step="1";price.required=true;price.value=p.precio;price.addEventListener("input",()=>p.precio=price.value);priceWrap.append(priceLabel,price);const stockWrap=document.createElement("div");const stockLabel=document.createElement("label");stockLabel.textContent="Stock";const stock=document.createElement("input");stock.type="number";stock.min="0";stock.step="1";stock.required=true;stock.value=p.stock;stock.addEventListener("input",()=>p.stock=stock.value);stockWrap.append(stockLabel,stock);row.append(name,priceWrap,stockWrap);list.append(row)}}$("loginForm").onsubmit=async e=>{e.preventDefault();status("Iniciando sesión...");try{await signIn($("email").value,$("password").value);$("password").value="";await load()}catch(err){token=null;show(false);status("No se pudo ingresar: "+err.message)}};$("save").onclick=async()=>{try{if(!items.every(p=>p.precio!==""&&p.stock!==""&&Number.isFinite(Number(p.precio))&&Number(p.precio)>=0&&Number.isInteger(Number(p.stock))&&Number(p.stock)>=0))throw Error("Revisá los precios y las cantidades: deben ser números válidos.");$("save").disabled=true;status("Guardando cambios...");for(const p of items){await request("/rest/v1/perfumes?id=eq."+encodeURIComponent(p.id),{method:"PATCH",headers:{...headers(true),"Prefer":"return=representation"},body:JSON.stringify({precio:Number(p.precio),stock:Number(p.stock),actualizado_en:new Date().toISOString()})}).then(rows=>{if(!Array.isArray(rows)||rows.length!==1)throw Error("No se pudo actualizar "+p.nombre+". Revisá los permisos de administrador.")})}status("Cambios guardados en Supabase. Ya se pueden ver en el catálogo público.");await load()}catch(err){status("Error al guardar: "+err.message)}finally{$("save").disabled=false}};$("reload").onclick=()=>load().catch(e=>status(e.message));$("logout").onclick=()=>{token=null;items=[];show(false);status("Sesión cerrada.")};show(false);
</script></body></html>
